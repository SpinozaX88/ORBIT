
name: Build ORBIT Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile ORBIT for Android
    runs-on: ubuntu-latest

    steps:
      - name: Get ORBIT source code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org fr.orbit .

      - name: Download Whisper Tiny model
        run: |
          mkdir -p assets/models
          curl -fL --retry 3 \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin \
            -o assets/models/ggml-tiny.bin
          test -s assets/models/ggml-tiny.bin

      - name: Install dependencies
        run: flutter pub get

      - name: Check Flutter project
        run: flutter analyze lib

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload ORBIT APK
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
